[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcecrop"
version = "0.1.0"
description = "Risk-constrained early crop classification research toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
io = ["h5py>=3.9"]
config = ["PyYAML>=6.0"]
data = ["h5py>=3.9", "pandas>=2.0", "PyYAML>=6.0", "scipy>=1.10"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
